# Deploys Supabase edge functions so the live backend matches `main`.
#
# - On push to main: redeploys only the functions whose files changed in that push.
#   (The live project has functions that aren't in this repo, and some repo copies may
#   be older than what's live, so we never blanket-deploy everything.)
# - Manually (Actions tab -> "Deploy Supabase functions" -> Run workflow): deploys the
#   function names you type, e.g. `create-checkout`.
#
# Requires the repo secret SUPABASE_ACCESS_TOKEN (Supabase dashboard -> Account ->
# Access Tokens). verify_jwt settings come from supabase/config.toml.

name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:
    inputs:
      functions:
        description: 'Function(s) to deploy, space-separated'
        required: true
        default: 'create-checkout'

concurrency:
  group: supabase-functions-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: tfuuelkswultbitktyhb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick functions to deploy
        id: pick
        env:
          INPUT_FUNCTIONS: ${{ github.event.inputs.functions }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            candidates="$INPUT_FUNCTIONS"
          else
            base="$BEFORE"
            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base="$(git rev-parse "${GITHUB_SHA}~1")"
            fi
            candidates="$(git diff --name-only "$base" "$GITHUB_SHA" -- supabase/functions | cut -d/ -f3 | sort -u)"
          fi

          fns=""
          for fn in $candidates; do
            if ! [[ "$fn" =~ ^[a-z0-9_-]+$ ]]; then
              echo "::error::Invalid function name: $fn"; exit 1
            fi
            case "$fn" in _*) continue ;; esac   # shared helpers, not functions
            if [ -f "supabase/functions/$fn/index.ts" ]; then
              fns="$fns $fn"
            elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::No function named '$fn' in supabase/functions"; exit 1
            fi
          done
          fns="$(echo $fns)"
          echo "Functions to deploy: ${fns:-none}"
          echo "functions=$fns" >> "$GITHUB_OUTPUT"

      - name: Check access token
        if: steps.pick.outputs.functions != ''
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        if: steps.pick.outputs.functions != ''
        with:
          version: latest

      - name: Deploy
        if: steps.pick.outputs.functions != ''
        env:
          FUNCTIONS: ${{ steps.pick.outputs.functions }}
        run: |
          set -euo pipefail
          for fn in $FUNCTIONS; do
            echo "::group::Deploying $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
            echo "::endgroup::"
          done
